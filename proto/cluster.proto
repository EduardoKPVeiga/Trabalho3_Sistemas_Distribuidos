syntax = "proto3";

package cluster;

// ==========================================
// Serviço de Comunicação do Cluster e Cliente
// ==========================================
service ClusterService {
  rpc RequestVote (RequestVoteRequest) returns (RequestVoteResponse);

  rpc Fetch (FetchRequest) returns (FetchResponse);

  rpc Write (ClientWriteRequest) returns (ClientWriteResponse);

  rpc Read (ClientReadRequest) returns (ClientReadResponse);
}

message LogEntry {
  int64 index = 1;
  int32 term = 2;
  string key = 3;
  string value = 4;
}

message RequestVoteRequest {
  int32 term = 1;
  string candidate_id = 2;
  int64 last_log_index = 3;
  int32 last_log_term = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  bool vote_granted = 2;
}

message FetchRequest {
  string replica_id = 1;
  int32 term = 2;
  int64 last_log_index = 3;
  int32 last_log_term = 4;
}

message FetchResponse {
  int32 term = 1;
  bool success = 2;
  repeated LogEntry entries = 3;
  int64 leader_commit_index = 4;
  int64 conflict_index = 5;
  string leader_id = 6;
}

message ClientWriteRequest {
  string key = 1;
  string value = 2;
}

message ClientWriteResponse {
  bool success = 1;
  string message = 2;
  string leader_id = 3;
  string leader_address = 4;
  int64 commit_index = 5;
}

message ClientReadRequest {
  string key = 1;
}

message ClientReadResponse {
  bool success = 1;
  string value = 2;
  string message = 3;
  int64 commit_index = 4;
}
